name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
          install: false
      - name: Link plugin
        run: mise plugins link lua "$GITHUB_WORKSPACE"
      - name: Install and run Lua
        run: |
          versions="5.4.8"
          # 5.1.5 needs readline headers on Linux and macOS, so only build it with MinGW
          if [ "$RUNNER_OS" = Windows ]; then versions="5.4.8 5.1.5"; fi
          for v in $versions; do
            mise use -g "lua@$v"
            mise exec -- lua -e 'print(_VERSION)'
          done
